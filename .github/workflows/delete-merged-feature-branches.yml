name: Delete merged feature branches

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'feature/'))
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature branches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const candidates = [];

            if (context.eventName === "push") {
              const closed = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: "closed", base: "main", per_page: 100
              });
              candidates.push(...closed.filter(pr =>
                pr.merged_at &&
                pr.head.ref.startsWith("feature/") &&
                pr.head.repo?.full_name === `${owner}/${repo}`
              ));
            } else {
              const pr = context.payload.pull_request;
              if (
                pr.merged &&
                pr.head.ref.startsWith("feature/") &&
                pr.head.repo?.full_name === `${owner}/${repo}`
              ) candidates.push(pr);
            }

            const uniqueBranches = [...new Set(candidates.map(pr => pr.head.ref))];
            for (const branch of uniqueBranches) {
              try {
                await github.rest.git.deleteRef({
                  owner, repo, ref: `heads/${branch}`
                });
                core.info(`Deleted merged feature branch: ${branch}`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info(`Branch already absent: ${branch}`);
                } else {
                  throw error;
                }
              }
            }
